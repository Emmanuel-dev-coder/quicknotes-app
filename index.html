<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>QuickNotes</h1>
        <p>A simple place to save your notes.</p>
    </header>

    <main>
        <section>
            <h2>Add a note</h2>

            <form id="note-form">
                <label for="note-input">Your note:</label>
                <input id="note-input" type="text">

                <label for="note-category">Category:</label>
                <select id="note-category">
                    <option value="personal">Personal</option>
                    <option value="work">Work</option>
                    <option value="study">Study</option>
                </select>

                <button type="submit">Add Note</button>
            </form>

            <p id="error-message"></p>
        </section>

        <section>
            <h2>Your notes</h2>

            <input
                id="search-input"
                type="text"
                placeholder="Search notes..."
            >

            <button id="clear-all-button" type="button">Clear all</button>

            <p id="note-count">You have no notes yet.</p>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>QuickNotes</p>
    </footer>
</body>
</html>
